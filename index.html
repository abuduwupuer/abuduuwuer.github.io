<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>极光游戏舱 · 瞬启</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 30% 20%, #0a0f2a, #030617);
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Microsoft YaHei', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* 动态流光背景 */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -30%;
    width: 160%;
    height: 160%;
    background: radial-gradient(circle, rgba(79, 70, 229, 0.25), rgba(139, 92, 246, 0.05) 70%);
    animation: aurora 14s infinite alternate ease-in-out;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes aurora {
    0% { transform: translate(0%, 0%) rotate(0deg); opacity: 0.6; }
    100% { transform: translate(4%, 6%) rotate(3deg); opacity: 1; }
  }

  /* 星空粒子 */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(2px 2px at 15% 35%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 72% 80%, #ffd966, transparent),
      radial-gradient(1.2px 1.2px at 38% 55%, #c084fc, transparent),
      radial-gradient(2.5px 2.5px at 90% 20%, #facc15, transparent);
    background-size: 240px 240px, 300px 300px, 200px 200px, 280px 280px;
    background-repeat: no-repeat;
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  /* 主卡片 */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(15, 25, 45, 0.65);
    backdrop-filter: blur(24px);
    border-radius: 56px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    width: 100%;
    max-width: 440px;
    padding: 40px 28px 44px;
    transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    animation: cardGlide 0.55s ease-out;
  }

  @keyframes cardGlide {
    0% { opacity: 0; transform: translateY(30px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  .page {
    display: none;
    animation: fadeUp 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 标题区 */
  .title {
    font-size: 34px;
    font-weight: 800;
    background: linear-gradient(135deg, #FFE6B0, #FFD580, #FFB347);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .desc {
    font-size: 14px;
    color: #b9c7ff;
    margin-bottom: 32px;
    border-left: 2px solid #ffd966;
    padding-left: 12px;
    font-weight: 470;
  }

  /* 按钮通用样式 */
  .btn {
    width: 100%;
    padding: 16px 0;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 60px;
    margin: 10px 0;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;
  }

  .btn:active {
    transform: scale(0.96);
    transition-duration: 0.05s;
  }

  /* 光泽扫光 */
  .btn::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 200%;
    height: 200%;
    background: linear-gradient(115deg, rgba(255,255,255,0) 10%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 90%);
    transform: rotate(25deg);
    transition: left 0.45s ease;
    pointer-events: none;
  }

  .btn:active::after {
    left: 120%;
  }

  /* 游戏渐变 */
  .btn-wangzhe { background: linear-gradient(105deg, #5F4DF7, #8A77FF); border: 1px solid rgba(200, 180, 255, 0.6); color: white; }
  .btn-heping { background: linear-gradient(105deg, #1DD1A1, #2EDF8C); border: 1px solid rgba(80, 255, 180, 0.5); color: #0a2f2a; }
  .btn-huoying { background: linear-gradient(105deg, #FF4757, #FF784B); border: 1px solid rgba(255, 100, 80, 0.6); color: white; }
  .btn-no { background: linear-gradient(105deg, #475569, #6C7A91); border: 1px solid rgba(200, 200, 240, 0.3); color: #f1f5f9; }
  .btn-gey { background: linear-gradient(105deg, #C084FC, #F472B6); border: 1px solid rgba(255, 160, 210, 0.7); color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }

  /* 移动状态下的按钮样式（绝对定位 + 过渡动画） */
  .btn-moving {
    position: fixed;
    z-index: 1000;
    width: auto;
    min-width: 140px;
    transition: top 0.2s ease, left 0.2s ease;
    margin: 0;
    box-shadow: 0 0 20px rgba(255,215,0,0.5);
  }

  /* 超大标题 */
  .big-title {
    font-size: 48px;
    font-weight: 800;
    text-align: center;
    background: linear-gradient(135deg, #FFD966, #FFB347);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    margin: 20px 0 16px;
    line-height: 1.2;
  }

  /* 最终页文字 */
  .final-text {
    font-size: 26px;
    font-weight: 500;
    line-height: 1.45;
    background: linear-gradient(125deg, #FFE3B0, #FFB84D);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    text-align: center;
    margin: 40px 0;
    padding: 0 12px;
  }

  /* 响应式 */
  @media (max-width: 480px) {
    .card { padding: 32px 20px; }
    .big-title { font-size: 38px; }
    .final-text { font-size: 22px; }
    .title { font-size: 28px; }
    .btn-moving { min-width: 120px; }
  }
</style>
</head>
<body>

<!-- 1. 主页面 -->
<div id="page-main" class="card page" style="display: block;">
  <div class="title">选择游戏</div>
  <div class="desc">点击直接打开已安装的游戏</div>
  <button class="btn btn-wangzhe" onclick="openWangzhe()">✨ 打开王者荣耀</button>
  <button class="btn btn-heping" onclick="openHeping()">🔫 打开和平精英</button>
  <button class="btn btn-huoying" onclick="openHuoying()">🍥 打开火影忍者</button>
  <button class="btn btn-no" id="noGameBtn" onclick="clickNoGame()">😴 不打游戏</button>
</div>

<!-- 2. 第三次点不打游戏显示的页面 -->
<div id="page-no-game" class="card page">
  <div class="big-title">不打游戏的就是gey</div>
  <button class="btn btn-gey" onclick="showGeyFinal()">🌈 我就是gey</button>
  <button class="btn btn-wangzhe" onclick="openWangzhe()">👑 打王者</button>
  <button class="btn btn-heping" onclick="openHeping()">🎯 打和平</button>
  <button class="btn btn-huoying" onclick="openHuoying()">🍜 打火影</button>
</div>

<!-- 3. 点我就是gey 最终页面 -->
<div id="page-gey" class="card page">
  <div class="big-title" style="font-size: 28px; line-height: 1.6;">其实我早就怀疑你是否gey，今天终于自己承认了</div>
</div>

<script>
  // ---------- 游戏启动逻辑（保持不变） ----------
  const GAME_DOWNLOAD_URL = {
    wangzhe: 'https://pvp.qq.com/',
    heping: 'https://gp.qq.com/',
    huoying: 'https://hyrz.qq.com/'
  };
  let pendingTimeout = null;

  function tryOpenApp(scheme, gameKey, gameName) {
    if (pendingTimeout) clearTimeout(pendingTimeout);
    let pageVisible = true;
    const handleVisibility = () => { pageVisible = false; };
    window.addEventListener('blur', handleVisibility, { once: true });
    window.location.href = scheme;
    pendingTimeout = setTimeout(() => {
      window.removeEventListener('blur', handleVisibility);
      if (pageVisible) {
        const userConfirm = confirm(`⚠️ 未检测到 ${gameName}\n是否前往官方渠道下载？`);
        if (userConfirm) {
          window.open(GAME_DOWNLOAD_URL[gameKey], '_blank');
        }
      }
      pendingTimeout = null;
    }, 1200);
  }

  function openWangzhe() {
    tryOpenApp("wangzhe://startgame", "wangzhe", "王者荣耀");
    setTimeout(() => { alert("正在打开王者荣耀…"); }, 200);
  }
  function openHeping() {
    tryOpenApp("heping://start", "heping", "和平精英");
    setTimeout(() => { alert("正在打开和平精英…"); }, 200);
  }
  function openHuoying() {
    tryOpenApp("huoying://start", "huoying", "火影忍者");
    setTimeout(() => { alert("正在打开火影忍者…"); }, 200);
  }

  // ---------- 不打游戏：随机移动 + 三次触发彩蛋（无提醒） ----------
  let noClickCount = 0;
  const pageMain = document.getElementById('page-main');
  const pageNoGame = document.getElementById('page-no-game');
  const pageGey = document.getElementById('page-gey');
  const noGameBtn = document.getElementById('noGameBtn');
  let originalBtnRect = null;
  let isMoving = false;

  // 获取按钮原始位置并记录尺寸
  function captureOriginalPosition() {
    if (!originalBtnRect) {
      const rect = noGameBtn.getBoundingClientRect();
      originalBtnRect = {
        top: rect.top,
        left: rect.left,
        width: rect.width,
        height: rect.height
      };
    }
  }

  // 将按钮还原到原始位置（解除绝对定位）
  function restoreButton() {
    if (isMoving) {
      noGameBtn.classList.remove('btn-moving');
      noGameBtn.style.position = '';
      noGameBtn.style.top = '';
      noGameBtn.style.left = '';
      noGameBtn.style.width = '';
      isMoving = false;
    }
  }

  // 随机移动按钮到视口内安全位置（绝对定位）
  function moveButtonRandomly() {
    if (!isMoving) {
      // 第一次移动时，记录原始位置并切换为绝对定位
      captureOriginalPosition();
      noGameBtn.classList.add('btn-moving');
      noGameBtn.style.width = originalBtnRect.width + 'px';
      isMoving = true;
    }
    const btnWidth = noGameBtn.offsetWidth;
    const btnHeight = noGameBtn.offsetHeight;
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    const maxLeft = viewportWidth - btnWidth - 10;
    const maxTop = viewportHeight - btnHeight - 10;
    const minLeft = 10;
    const minTop = 10;
    let newLeft = Math.random() * (maxLeft - minLeft) + minLeft;
    let newTop = Math.random() * (maxTop - minTop) + minTop;
    newLeft = Math.min(maxLeft, Math.max(minLeft, newLeft));
    newTop = Math.min(maxTop, Math.max(minTop, newTop));
    noGameBtn.style.left = newLeft + 'px';
    noGameBtn.style.top = newTop + 'px';
  }

  // 点击不打游戏的主逻辑（无 alert）
  function clickNoGame() {
    // 如果已经进入隐藏页面，不再移动
    if (pageMain.style.display === 'none') return;

    noClickCount++;
    if (noClickCount < 3) {
      // 前两次：移动按钮
      moveButtonRandomly();
    } else if (noClickCount === 3) {
      // 第三次：还原按钮位置，跳转隐藏页面
      restoreButton();
      pageMain.style.display = 'none';
      pageNoGame.style.display = 'block';
      // 重置计数器（可选，因为页面已隐藏）
      noClickCount = 0;
    }
  }

  // 显示最终gey页面
  function showGeyFinal() {
    pageNoGame.style.display = 'none';
    pageGey.style.display = 'block';
  }

  // 窗口大小改变时，如果按钮在移动状态，重新调整位置避免越界
  window.addEventListener('resize', () => {
    if (isMoving) {
      moveButtonRandomly();
    }
  });
</script>
</body>
</html>
