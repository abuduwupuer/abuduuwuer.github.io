<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>极光游戏舱 · 一键启动</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 30% 20%, #0a0f2a, #030617);
    font-family: 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', 'Microsoft YaHei', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  /* 动态流光背景 */
  body::before {
    content: '';
    position: fixed;
    top: -50%;
    left: -30%;
    width: 160%;
    height: 160%;
    background: radial-gradient(circle, rgba(79, 70, 229, 0.25), rgba(139, 92, 246, 0.05) 70%);
    animation: aurora 14s infinite alternate ease-in-out;
    pointer-events: none;
    z-index: 0;
  }

  @keyframes aurora {
    0% { transform: translate(0%, 0%) rotate(0deg); opacity: 0.6; }
    100% { transform: translate(4%, 6%) rotate(3deg); opacity: 1; }
  }

  /* 星空粒子背景 */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(2px 2px at 15% 35%, #fff, transparent),
      radial-gradient(1.8px 1.8px at 72% 80%, #ffd966, transparent),
      radial-gradient(1.2px 1.2px at 38% 55%, #c084fc, transparent),
      radial-gradient(2.5px 2.5px at 90% 20%, #facc15, transparent);
    background-size: 240px 240px, 300px 300px, 200px 200px, 280px 280px;
    background-repeat: no-repeat;
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
  }

  /* 主卡片容器 */
  .card {
    position: relative;
    z-index: 10;
    background: rgba(15, 25, 45, 0.65);
    backdrop-filter: blur(24px);
    border-radius: 56px;
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
    width: 100%;
    max-width: 440px;
    padding: 40px 28px 44px;
    transition: transform 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    animation: cardGlide 0.55s ease-out;
  }

  @keyframes cardGlide {
    0% { opacity: 0; transform: translateY(30px) scale(0.96); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* 页面切换控制 */
  .page {
    display: none;
    animation: fadeUp 0.4s cubic-bezier(0.2, 0.9, 0.3, 1);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 标题样式 */
  .title {
    font-size: 34px;
    font-weight: 800;
    background: linear-gradient(135deg, #FFE6B0, #FFD580, #FFB347);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    letter-spacing: -0.5px;
    margin-bottom: 8px;
    text-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }

  .desc {
    font-size: 14px;
    color: #b9c7ff;
    margin-bottom: 32px;
    border-left: 2px solid #ffd966;
    padding-left: 12px;
    font-weight: 470;
  }

  /* 按钮通用样式 */
  .btn {
    width: 100%;
    padding: 16px 0;
    font-size: 17px;
    font-weight: 600;
    border: none;
    border-radius: 60px;
    margin: 10px 0;
    cursor: pointer;
    transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    letter-spacing: 0.5px;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
    position: relative;
    overflow: hidden;
  }

  .btn:active {
    transform: scale(0.96);
    transition-duration: 0.05s;
  }

  /* 按钮扫光动画 */
  .btn::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -60%;
    width: 200%;
    height: 200%;
    background: linear-gradient(115deg, rgba(255,255,255,0) 10%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 90%);
    transform: rotate(25deg);
    transition: left 0.45s ease;
    pointer-events: none;
  }

  .btn:active::after {
    left: 120%;
  }

  /* 游戏按钮专属渐变 */
  .btn-wangzhe { background: linear-gradient(105deg, #5F4DF7, #8A77FF); border: 1px solid rgba(200, 180, 255, 0.6); color: white; }
  .btn-heping { background: linear-gradient(105deg, #1DD1A1, #2EDF8C); border: 1px solid rgba(80, 255, 180, 0.5); color: #0a2f2a; }
  .btn-huoying { background: linear-gradient(105deg, #FF4757, #FF784B); border: 1px solid rgba(255, 100, 80, 0.6); color: white; }
  .btn-no { background: linear-gradient(105deg, #475569, #6C7A91); border: 1px solid rgba(200, 200, 240, 0.3); color: #f1f5f9; }
  .btn-gey { background: linear-gradient(105deg, #C084FC, #F472B6); border: 1px solid rgba(255, 160, 210, 0.7); color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.2); }

  /* 超大标题样式 */
  .big-title {
    font-size: 48px;
    font-weight: 800;
    text-align: center;
    background: linear-gradient(135deg, #FFD966, #FFB347);
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    margin: 20px 0 16px;
    line-height: 1.2;
  }

  /* 响应式适配手机端 */
  @media (max-width: 480px) {
    .card { padding: 32px 20px; }
    .big-title { font-size: 38px; }
    .title { font-size: 28px; }
  }
</style>
</head>
<body>

<!-- 1. 主页面：游戏选择 -->
<div id="page-main" class="card page" style="display: block;">
  <div class="title">选择游戏</div>
  <div class="desc">点击直接打开已安装的游戏 · 整活彩蛋版</div>
  <button class="btn btn-wangzhe" id="openWangzheBtn">✨ 打开王者荣耀</button>
  <button class="btn btn-heping" id="openHepingBtn">🔫 打开和平精英</button>
  <button class="btn btn-huoying" id="openHuoyingBtn">🍥 打开火影忍者</button>
  <button class="btn btn-no" id="noGameBtn">😴 不打游戏</button>
</div>

<!-- 2. 彩蛋页面：第三次点中不打游戏显示 -->
<div id="page-no-game" class="card page">
  <div class="big-title">不打游戏的就是gey</div>
  <button class="btn btn-gey" id="geyConfirmBtn">🌈 我就是gey</button>
  <button class="btn btn-wangzhe" id="noGameWangzheBtn">👑 打王者</button>
  <button class="btn btn-heping" id="noGameHepingBtn">🎯 打和平</button>
  <button class="btn btn-huoying" id="noGameHuoyingBtn">🍜 打火影</button>
</div>

<!-- 3. 最终确认页面 -->
<div id="page-gey" class="card page">
  <div class="big-title" style="font-size: 28px; line-height: 1.6;">其实我早就怀疑你是否gey，今天终于自己承认了</div>
</div>

<script>
  // 游戏配置：专属唤起协议 + 官网兜底链接
  const GAME_CONFIG = {
    wangzhe: {
      scheme: 'wangzhe://',
      downloadUrl: 'https://pvp.qq.com/'
    },
    heping: {
      scheme: 'hpjy://',
      downloadUrl: 'https://gp.qq.com/'
    },
    huoying: {
      scheme: 'hyrz://',
      downloadUrl: 'https://hyrz.qq.com/'
    }
  };

  // 不打游戏按钮点击计数
  let noGameClickCount = 0;

  // 页面切换函数
  function showPage(pageId) {
    // 隐藏所有页面
    document.querySelectorAll('.page').forEach(page => {
      page.style.display = 'none';
    });
    // 显示目标页面
    const targetPage = document.getElementById(pageId);
    targetPage.style.display = 'block';

    // 回到主页面时，重置按钮状态和计数
    if (pageId === 'page-main') {
      resetNoGameBtn();
    }
  }

  // 重置不打游戏按钮：还原位置、样式、计数
  function resetNoGameBtn() {
    const btn = document.getElementById('noGameBtn');
    // 清除固定定位，回到原位置
    btn.style.position = '';
    btn.style.zIndex = '';
    btn.style.left = '';
    btn.style.top = '';
    btn.style.width = '';
    // 重置计数
    noGameClickCount = 0;
  }

  // 核心唤起游戏函数
  function openGame(gameKey) {
    const { scheme, downloadUrl } = GAME_CONFIG[gameKey];
    let jumpTimer = null;

    // 尝试唤起本地已安装的游戏App
    window.location.href = scheme;

    // 兜底逻辑：800ms后未唤起成功，自动跳转到游戏官网
    jumpTimer = setTimeout(() => {
      if (!document.hidden) {
        window.location.href = downloadUrl;
      }
    }, 800);

    // 成功唤起App时，取消跳转官网
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        clearTimeout(jumpTimer);
      }
    }, { once: true });
  }

  // ---------------------- 按钮点击事件绑定 ----------------------
  // 主页面游戏启动按钮
  document.getElementById('openWangzheBtn').addEventListener('click', () => openGame('wangzhe'));
  document.getElementById('openHepingBtn').addEventListener('click', () => openGame('heping'));
  document.getElementById('openHuoyingBtn').addEventListener('click', () => openGame('huoying'));

  // 核心整活：不打游戏按钮逻辑
  document.getElementById('noGameBtn').addEventListener('click', () => {
    const btn = document.getElementById('noGameBtn');
    noGameClickCount++;

    // 前2次点击：按钮全屏随机移动，不让点中
    if (noGameClickCount < 3) {
      // 固定按钮样式，避免变形，提升层级确保不被遮挡
      btn.style.position = 'fixed';
      btn.style.zIndex = '9999';
      btn.style.width = btn.offsetWidth + 'px';

      // 屏幕可视区域尺寸 + 安全边距（避免贴边找不到）
      const screenWidth = window.innerWidth;
      const screenHeight = window.innerHeight;
      const btnWidth = btn.offsetWidth;
      const btnHeight = btn.offsetHeight;
      const safeMargin = 20;

      // 计算随机位置，确保按钮完全在屏幕内
      const maxLeft = screenWidth - btnWidth - safeMargin * 2;
      const maxTop = screenHeight - btnHeight - safeMargin * 2;
      const randomLeft = Math.floor(Math.random() * maxLeft) + safeMargin;
      const randomTop = Math.floor(Math.random() * maxTop) + safeMargin;

      // 触发移动动画
      btn.style.left = randomLeft + 'px';
      btn.style.top = randomTop + 'px';
    } else {
      // 第3次点击：触发彩蛋页面，重置按钮状态
      resetNoGameBtn();
      showPage('page-no-game');
    }
  });

  // 彩蛋页面按钮绑定
  document.getElementById('geyConfirmBtn').addEventListener('click', () => showPage('page-gey'));
  document.getElementById('noGameWangzheBtn').addEventListener('click', () => openGame('wangzhe'));
  document.getElementById('noGameHepingBtn').addEventListener('click', () => openGame('heping'));
  document.getElementById('noGameHuoyingBtn').addEventListener('click', () => openGame('huoying'));
</script>
</body>
</html>
