<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>今日开黑·极速启动</title>
    <style>
        /* 全局重置——街机霓虹风 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            /* 电竞赛博渐变：紫→橙→红 */
            background: radial-gradient(circle at 30% 30%, #0b0c1e, #1a1a3d, #2d0a1f);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            width: 100vw;
            padding: 16px;
            color: #fff;
            overflow-x: hidden;
            /* 手机浏览器滚动修复 */
            overflow-y: auto;
        }

        /* 荧光标题——带扫描线效果 */
        .title {
            font-size: 32px;
            font-weight: 900;
            text-transform: uppercase;
            text-shadow: 0 0 12px #00f7ff, 0 0 30px #ff2d75, 0 0 60px #7a04eb;
            margin-bottom: 30px;
            margin-top: 10px;
            text-align: center;
            letter-spacing: 5px;
            animation: flicker 2s infinite alternate;
            word-break: break-word;
        }
        @keyframes flicker {
            0% { opacity: 1; text-shadow: 0 0 12px cyan, 0 0 30px #ff2d75; }
            100% { opacity: 0.95; text-shadow: 0 0 20px #ffaa00, 0 0 50px #ff00aa; }
        }

        /* 主按钮容器——采用弹性布局，不打按钮绝对定位 */
        .btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 28px;
            width: 90%;
            max-width: 360px;
            margin-bottom: 40px;
            position: relative;
        }

        /* 基础游戏按钮样式——重甲质感 */
        .game-btn {
            padding: 18px 0;
            font-size: 22px;
            border: none;
            border-radius: 60px; /* 胶囊风格 */
            cursor: pointer;
            width: 100%;
            color: white;
            font-weight: 800;
            letter-spacing: 4px;
            box-shadow: 0 8px 0 rgba(0,0,0,0.4), 0 0 25px rgba(255,215,0,0.5);
            transition: all 0.1s cubic-bezier(0.2, 1.2, 0.8, 1);
            position: relative;
            z-index: 5;
            border: 1px solid rgba(255,255,255,0.4);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
        }
        .game-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5), 0 0 40px gold;
        }

        /* 和平精英——冰蓝战甲 + 橙闪 */
        #peaceBtn {
            background: linear-gradient(145deg, #0057b3, #ff6a00);
            background-size: 200% 200%;
        }

        /* 王者荣耀——红金霸体 */
        #kingBtn {
            background: linear-gradient(145deg, #c41e3a, #ffb347);
            background-size: 200% 200%;
        }

        /* 不打按钮 —— 狂暴模式，绝对定位 */
        #noPlayBtn {
            padding: 18px 0;
            font-size: 22px;
            border: none;
            border-radius: 60px;
            background: linear-gradient(145deg, #1e1e1e, #aa2e2e);
            color: white;
            font-weight: 800;
            letter-spacing: 4px;
            cursor: pointer;
            box-shadow: 0 0 20px #ff4444;
            border: 1px solid #ff9999;
            width: 90%;
            max-width: 360px;
            position: absolute;
            top: 200px;  /* 初始位置会在js里校准 */
            left: 50%;
            transform: translateX(-50%);
            z-index: 50;
            transition: left 0.12s ease, top 0.12s ease, transform 0.1s;
            will-change: left, top;
            text-shadow: 0 0 8px black;
        }
        #noPlayBtn.shake {
            animation: panicShake 0.2s infinite;
        }
        @keyframes panicShake {
            0% { transform: translateX(-50%) translate(0,0); }
            20% { transform: translateX(-50%) translate(-12px, 6px); }
            40% { transform: translateX(-50%) translate(12px, -8px); }
            60% { transform: translateX(-50%) translate(-8px, -6px); }
            80% { transform: translateX(-50%) translate(10px, 8px); }
            100% { transform: translateX(-50%) translate(0,0); }
        }

        /* 自定义弹窗——电竞终结技风格 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 20, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal.show {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-content {
            background: radial-gradient(circle at 50% 0%, #2a1b3d, #140b1c);
            padding: 32px 20px;
            border-radius: 40px;
            width: 80%;
            max-width: 320px;
            text-align: center;
            border: 2px solid #ffd966;
            box-shadow: 0 0 40px #ffb700;
            animation: modalPulse 1s infinite alternate;
        }
        @keyframes modalPulse {
            from { box-shadow: 0 0 30px #ffaa33; }
            to { box-shadow: 0 0 60px #ff5500; }
        }
        .modal-title {
            font-size: 26px;
            margin-bottom: 18px;
            color: #ffe083;
            text-shadow: 0 0 6px red;
            font-weight: 900;
        }
        .modal-text {
            font-size: 17px;
            line-height: 1.55;
            margin-bottom: 24px;
            color: #f0f0ff;
            word-break: break-word;
        }
        .modal-btn {
            padding: 12px 30px;
            background: #ffaa33;
            border: none;
            border-radius: 50px;
            font-size: 20px;
            font-weight: bold;
            color: #1a001a;
            box-shadow: 0 6px 0 #b35e00;
            transition: 0.05s linear;
            cursor: pointer;
        }
        .modal-btn:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #b35e00;
        }

        /* 针对刘海屏等底部适应 */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            body { padding-bottom: env(safe-area-inset-bottom); }
        }
    </style>
</head>
<body>
    <h1 class="title">今日开黑啥游戏？</h1>
    
    <div class="btn-container">
        <button class="game-btn" id="peaceBtn">⚡ 打和平精英</button>
        <button class="game-btn" id="kingBtn">👑 打王者荣耀</button>
        <!-- 不打按钮已经在btn-container内绝对定位，不占flex流 -->
        <button id="noPlayBtn">🏃 不打！就不打！</button>
    </div>

    <!-- 核弹级提示窗 -->
    <div class="modal" id="tipsModal">
        <div class="modal-content">
            <h3 class="modal-title" id="modalTitle">⚡ 开黑引擎 ⚡</h3>
            <p class="modal-text" id="modalText">正在唤醒游戏...</p>
            <button class="modal-btn" id="modalConfirmBtn">立即冲锋</button>
        </div>
    </div>

    <script>
        (function(){
            "use strict";

            // ---------- 元素绑定 ----------
            const peaceBtn = document.getElementById('peaceBtn');
            const kingBtn = document.getElementById('kingBtn');
            const noPlayBtn = document.getElementById('noPlayBtn');
            const modal = document.getElementById('tipsModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalText = document.getElementById('modalText');
            const modalConfirmBtn = document.getElementById('modalConfirmBtn');

            // ---------- 精确设备探测 ----------
            function isIOS() {
                return /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase()) && !window.MSStream;
            }
            function isAndroid() {
                return /android/.test(navigator.userAgent.toLowerCase());
            }

            // ---------- 弹窗控制器 ----------
            function showModal(title, text, hideBtn = false) {
                modalTitle.textContent = title || '提示';
                modalText.textContent = text || '';
                modal.classList.add('show');
            }

            function closeModal() {
                modal.classList.remove('show');
            }

            // 点击模态背景关闭，或点按钮关闭
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    closeModal();
                }
            });
            modalConfirmBtn.addEventListener('click', closeModal);

            // ---------- 核心：直接启动游戏（无alert、无跳转官网兜底）--------
            function launchGameDirect(scheme, gameName) {
                const iOS = isIOS();
                const android = isAndroid();

                // ✅ 第一步：根据不同平台给出最简提示，但不阻碍唤起
                if (iOS) {
                    showModal(
                        '🍎 快速启动',
                        `正在尝试打开「${gameName}」...\\n如果未跳转，请确保已安装游戏，并使用 Safari 浏览器。`
                    );
                } else if (android) {
                    showModal(
                        '🤖 一键开黑',
                        `正在唤醒「${gameName}」客户端，\\n稍后请允许应用跳转~`
                    );
                } else {
                    showModal('💻 PC玩家', 'PC端暂不支持应用唤起，请用手机访问本页。');
                    return;  // 非手机就不跳转了
                }

                // ✅ 第二步：立即执行跳转！不等待、不设置跳转官网 —— 仅尝试唤醒scheme
                try {
                    // 核心操作：直接修改window.location 启动游戏
                    window.location.href = scheme;
                } catch (e) {
                    // 极罕见情况 —— 哪怕异常也简单提示，绝不跳转网页
                    showModal('🚫 启动失败', `请确认已安装「${gameName}」`, false);
                }

                // ✅ 移除所有“定时跳转官网”的逻辑，坚决不自动打开网页！
                // 但我们保留一个友好提醒：告知用户如果没反应需要手动打开游戏（不强制跳转）
                // 设置一个超时提醒，但只提示，不跳转URL
                const timeoutId = setTimeout(() => {
                    // 仅当弹窗仍开着且内容未被用户关闭时，追加一句温和引导
                    if (modal.classList.contains('show')) {
                        modalText.textContent = `仍未进入「${gameName}」？请确认游戏已安装，并从桌面图标手动启动。`;
                        modalTitle.textContent = '⏳ 等待跳转';
                    } else {
                        // 如果弹窗被关了，重新弹一个纯提醒
                        showModal('⏳ 还没进来？', `请确保已安装「${gameName}」，并手动打开吧~`);
                    }
                }, 2000); // 2秒后提示，但不跳转页面
                // 清理定时器避免内存堆积——但为了安全在关闭弹窗时取消
                const originalClose = closeModal;
                window.closeModal = function() {
                    clearTimeout(timeoutId);
                    modal.classList.remove('show');
                };
                modalConfirmBtn.onclick = function() {
                    clearTimeout(timeoutId);
                    closeModal();
                };
            }

            // ---------- 事件绑定 ----------
            // 【和平精英】直接启动
            peaceBtn.addEventListener('click', function(e) {
                e.stopPropagation(); // 防止干扰
                // 和平精英官方scheme (主流)
                launchGameDirect('gameforpeace://', '和平精英');
            });

            // 【王者荣耀】直接启动
            kingBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                // 王者荣耀官方scheme
                launchGameDirect('kingglory://', '王者荣耀');
            });

            // ---------- 不打按钮：狂暴跑路 + 抖动 ----------
            let speedFactor = 1.2;  // 初始逃逸系数

            function runawayNoPlayBtn() {
                // 增加疯狂程度
                speedFactor += 0.15;
                if (speedFactor > 3.5) speedFactor = 3.5; // 限制最大速度

                // 添加晃动
                noPlayBtn.classList.add('shake');
                setTimeout(() => {
                    noPlayBtn.classList.remove('shake');
                }, 280);

                // 获取可视区域边界，保证按钮不跑出屏幕
                const btnWidth = noPlayBtn.offsetWidth;
                const btnHeight = noPlayBtn.offsetHeight;
                const winW = window.innerWidth;
                const winH = window.innerHeight;

                // 随机范围，预留边缘空间
                const maxLeft = winW - btnWidth - 10;
                const maxTop = winH - btnHeight - 20;

                // 计算新位置，越跑越远
                let randomX = Math.floor(Math.random() * maxLeft * (speedFactor * 0.7));
                let randomY = Math.floor(Math.random() * maxTop * (speedFactor * 0.8));

                // 边界保护
                randomX = Math.min(Math.max(randomX, 8), maxLeft);
                randomY = Math.min(Math.max(randomY, 50), maxTop);  // 避免顶栏

                // 直接应用left、top。保留translateX(-50%) 不干扰？
                // 注意noPlayBtn默认有transform: translateX(-50%)，用left:50%定位。
                // 为了自由移动，我们去除transform干扰，改用left、top绝对偏移。
                noPlayBtn.style.transform = 'none';    // 移除居中偏移，完全自由
                noPlayBtn.style.left = randomX + 'px';
                noPlayBtn.style.top = randomY + 'px';
            }

            // 绑定鼠标进入 和 触摸开始（手指放上就逃跑）
            noPlayBtn.addEventListener('mouseenter', runawayNoPlayBtn);
            noPlayBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();  // 防止触发click
                runawayNoPlayBtn();
            });

            // 额外：如果用户强行点击“不打”按钮，直接触发逃跑+提示，绝不让它轻易点到！
            noPlayBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                runawayNoPlayBtn();  // 再跑一次
                showModal('😈 抓不到', '嘿嘿，就是不让你点！', false);
                return false;
            });

            // ---------- 初始化“不打”按钮位置（置于王者下方）----------
            function setInitialNoPlayPosition() {
                // 让按钮处于“王者荣耀”下方靠右，体现调皮感
                if (kingBtn) {
                    const kingRect = kingBtn.getBoundingClientRect();
                    // 如果按钮尚未渲染完全，回退
                    if (kingRect.width > 0) {
                        noPlayBtn.style.transform = 'none';
                        noPlayBtn.style.left = (kingRect.left + 20) + 'px';
                        noPlayBtn.style.top = (kingRect.bottom + 30) + 'px';
                    } else {
                        // 后备
                        noPlayBtn.style.transform = 'none';
                        noPlayBtn.style.left = '30px';
                        noPlayBtn.style.top = '400px';
                    }
                }
            }

            // 页面加载完成和resize时重新调整初始位置，避免跑出视线
            window.addEventListener('load', function() {
                setInitialNoPlayPosition();
            });
            window.addEventListener('resize', function() {
                // 但若按钮已经在跑动状态，不强制重置，保留灵活性
                if (!noPlayBtn.style.left) {
                    setInitialNoPlayPosition();
                }
            });

            // 延迟一次确保初始位置
            setTimeout(setInitialNoPlayPosition, 30);

            // ---------- 禁止其他默认跳转，完完全全删除备用网址逻辑 ----------
            // 并修复之前代码中的事件重复绑定问题：原代码绑定了两次peaceBtn，去掉。
            // 我们已经覆盖了peaceBtn监听，无冲突。
            // 把之前重复绑定的移除（通过覆盖）
            // 完全安全。

            // 额外：针对iOS微信中无法直接跳转，我们依然弹提示，但绝对不去跳官网。
            // 完整体现“直接启动游戏”的意图。
            // 另外：防止用户通过摇一摇等意外触发，不做多余跳转。

        })();
    </script>

    <!-- 保证完全覆盖旧有的重复监听，确保和平按钮只执行一次直接启动 -->
    <script>
        // 二次保险：移除所有可能残留的监听器，并确保和平/王者跳转时绝对不打开网页。
        (function finalTouch() {
            // 重写launchGame相关函数，避免任何备用网址调用
            const peace = document.getElementById('peaceBtn');
            const king = document.getElementById('kingBtn');
            // 克隆替换? 简单直接: 重新挂载最干净的事件
            const newPeace = peace.cloneNode(true);
            const newKing = king.cloneNode(true);
            const parent = peace.parentNode;
            parent.replaceChild(newPeace, peace);
            parent.replaceChild(newKing, king);

            // 重新绑定, 并且完全无后备网址
            const peaceFresh = document.getElementById('peaceBtn');
            const kingFresh = document.getElementById('kingBtn');
            const modalFresh = document.getElementById('tipsModal');
            const noPlayFresh = document.getElementById('noPlayBtn'); // 保留原有noPlay不用克隆

            function directLaunch(scheme, game) {
                // 最简化唤起，无后备
                if (isIOS()) {
                    alert('即将启动 ' + game + ' (iOS)\\n请确认已安装游戏，并在Safari打开。');
                } else if (isAndroid()) {
                    alert('正在启动 ' + game);
                }
                window.location.href = scheme;
            }

            function isIOS() {
                return /iphone|ipad|ipod/.test(navigator.userAgent.toLowerCase());
            }

            peaceFresh.addEventListener('click', function(e) {
                e.preventDefault();
                directLaunch('gameforpeace://', '和平精英');
            });

            kingFresh.addEventListener('click', function(e) {
                e.preventDefault();
                directLaunch('kingglory://', '王者荣耀');
            });

            // 确保不打按钮依旧狂暴
            // 但保留之前已有的行为，这里仅增强
        })();
    </script>
</body>
</html>
