<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>你有病吗？</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* 禁止选中，提升整蛊体验 */
        }
        body {
            background: linear-gradient(145deg, #2b5a5a 0%, #1d3e3e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            padding: 16px;
            margin: 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            padding: 30px 20px;
            border-radius: 48px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 2px solid #fbd786;
            transition: 0.3s;
        }
        h1 {
            font-size: 3rem;
            font-weight: 800;
            color: #1e2f2f;
            text-shadow: 4px 4px 0 #ffeaa5;
            letter-spacing: 6px;
            word-break: break-word;
            margin-bottom: 24px;
        }
        .question {
            font-size: 2.8rem;
            font-weight: bold;
            color: #a13d2f;
            background: #fffbe3;
            padding: 20px 10px;
            border-radius: 100px;
            margin-bottom: 40px;
            border: 3px dashed #b34141;
            box-shadow: inset 0 0 0 3px #ffe3a4;
        }
        .btn-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 40px;
            flex-wrap: wrap;
            position: relative;
            min-height: 100px;
        }
        .btn {
            border: none;
            background: #ffb347;
            color: #1e2f2f;
            font-size: 2.2rem;
            font-weight: 900;
            padding: 18px 50px;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 12px 0 #b36b1e, 0 10px 25px rgba(0,0,0,0.3);
            transition: 0.08s linear;
            letter-spacing: 10px;
            border: 3px solid #fff9e6;
            transform: scale(1);
            will-change: transform, left, top, right, bottom;
            z-index: 10;
        }
        /* “有” 按钮 —— 稳重优雅 */
        .btn-yes {
            background: #68c8a0;
            box-shadow: 0 12px 0 #3a7856, 0 10px 25px rgba(0,0,0,0.3);
        }
        .btn-yes:hover {
            background: #7ed9b0;
            transform: scale(1.02);
        }
        /* “没有” 按钮 —— 绝对不让点中！ */
        .btn-no {
            background: #ff7b7b;
            box-shadow: 0 12px 0 #b44343, 0 10px 25px rgba(0,0,0,0.3);
            position: relative; /* 默认static, 但js会改成absolute并随机飞走 */
            transition: all 0.1s cubic-bezier(0.34, 1.5, 0.64, 1); /* 弹跳感 */
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14" fill="none" stroke="%23ff0000" stroke-width="3"/><line x1="6" y1="6" x2="26" y2="26" stroke="%23ff0000" stroke-width="4"/><line x1="26" y1="6" x2="6" y2="26" stroke="%23ff0000" stroke-width="4"/></svg>') 16 16, not-allowed;
        }
        /* 提示信息框 */
        .message-area {
            margin-top: 40px;
            font-size: 2rem;
            font-weight: bold;
            color: #fcf4d9;
            background: #2e4c4c;
            padding: 16px;
            border-radius: 50px;
            border: 2px solid #ffd966;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: linear-gradient(145deg, #3a5f5f, #1e3a3a);
            box-shadow: inset 0 -2px 10px rgba(0,0,0,0.6);
            transition: 0.2s;
        }
        .small-note {
            margin-top: 24px;
            color: #ffeab5;
            font-size: 1.2rem;
            background: #2b4f4f;
            padding: 10px;
            border-radius: 40px;
            opacity: 0.9;
        }
        /* 手机触摸优化 */
        @media (max-width: 500px) {
            h1 { font-size: 2.4rem; }
            .question { font-size: 2rem; }
            .btn { font-size: 1.8rem; padding: 14px 30px; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>😈 灵魂拷问 😈</h1>
        <div class="question">你有病吗？</div>
        
        <div class="btn-container" id="btnContainer">
            <!-- 有 按钮 -->
            <button class="btn btn-yes" id="btnYes">有</button>
            <!-- 没有 按钮 -->
            <button class="btn btn-no" id="btnNo">没有</button>
        </div>

        <!-- 显示调皮结果 -->
        <div class="message-area" id="messageBox">
            🤔 请选择...
        </div>
        <div class="small-note">
            💨 “没有”按钮会影分身术～ 点“有”才是真相
        </div>
    </div>

    <script>
        (function() {
            "use strict";

            // ----- 获取元素 -----
            const btnYes = document.getElementById('btnYes');
            const btnNo = document.getElementById('btnNo');
            const messageBox = document.getElementById('messageBox');
            const container = document.getElementById('btnContainer');

            // ----- 状态标记：是否已经触发“有”的最终审判 -----
            let hasConfirmedSick = false;

            // ----- 辅助函数：生成随机整数 [min, max] -----
            function randomInt(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            // ----- 让“没有”按钮开始逃亡！-----
            function escapeNoButton() {
                // 确保容器有相对定位，作为按钮绝对定位的参考
                container.style.position = 'relative';
                
                // 把 btnNo 设置为绝对定位，脱离文档流，方便到处跑
                btnNo.style.position = 'absolute';
                
                // 获取容器和按钮的尺寸
                const containerRect = container.getBoundingClientRect();
                const btnRect = btnNo.getBoundingClientRect();

                // 按钮宽高 (包括外边距影响？但我们直接用offset宽高更稳定)
                const btnWidth = btnNo.offsetWidth;
                const btnHeight = btnNo.offsetHeight;

                // 容器内边距和边界 —— 保证按钮不跑出可视容器
                // 但为了整蛊效果，可以稍微允许超出边缘？最好还是限定在容器内，防止看不见
                const padding = 10; // 留一些边界，不贴边
                const maxLeft = Math.max(container.clientWidth - btnWidth - padding, 20);
                const maxTop = Math.max(container.clientHeight - btnHeight - padding, 20);
                
                // 随机生成新的 left 和 top (相对容器)
                // 如果容器太小，至少保留在合理位置
                let newLeft, newTop;
                
                if (maxLeft <= padding) {
                    newLeft = padding;
                } else {
                    newLeft = randomInt(padding, maxLeft);
                }
                
                if (maxTop <= padding) {
                    newTop = padding;
                } else {
                    newTop = randomInt(padding, maxTop);
                }

                // 应用新坐标
                btnNo.style.left = newLeft + 'px';
                btnNo.style.top = newTop + 'px';
                
                // 加点旋转/缩放增加喜感 (可选)
                btnNo.style.transform = `rotate(${randomInt(-15, 15)}deg) scale(0.95)`;
            }

            // ----- 重置“没有”按钮位置（初始时或按“有”之后可以复位）-----
            function resetNoButton() {
                // 移除绝对定位和相关内联样式，回到普通流
                btnNo.style.position = '';
                btnNo.style.left = '';
                btnNo.style.top = '';
                btnNo.style.transform = '';  // 恢复默认
                // 强制重绘确保回归原位
            }

            // ----- 当点击“没有”按钮，触发逃跑+嘲讽-----
            function onNoClick(event) {
                // 如果已经确诊有病，那“没有”按钮就不乱跑了，显示阴阳怪气消息
                if (hasConfirmedSick) {
                    messageBox.innerHTML = '😜 还嘴硬？你明明就有病！';
                    // 照样逃跑，增加幽默
                    escapeNoButton();
                    return;
                }

                // 未确诊情况下：点击“没有” -> 逃跑 + 更新消息
                escapeNoButton();
                
                // 每次逃跑，显示不同嘲笑语
                const sarcasmList = [
                    '🤪 你点不到我~',
                    '🏃💨 略略略！',
                    '🍃 抓不到～',
                    '😘 就是不给你点',
                    '🎈 飞走咯！',
                    '🔥 有本事再来',
                    '👻 点不着点不着',
                    '🌟 嘿嘿，没有按钮跑跑跑'
                ];
                const randomMsg = sarcasmList[Math.floor(Math.random() * sarcasmList.length)];
                messageBox.innerHTML = randomMsg;
                
                // 额外加戏：稍微让按钮抖动嘲讽
                // 不阻止事件冒泡，但没必要
            }

            // ----- 当点击“有”按钮，展示“我就知道你有病”-----
            function onYesClick(event) {
                // 标记已确诊，之后“没有”按钮继续乱跑但话语改变
                hasConfirmedSick = true;
                
                // 显示固定最终消息
                messageBox.innerHTML = '😈 我就知道你有病！ 😈';
                
                // 把逃跑的“没有”按钮抓回来（取消绝对定位，回到身旁）
                resetNoButton();
                
                // 但是要让它还是“没有”按钮，但不能再点中？ 我们保留它，但是用户可能仍尝试点击“没有”
                // 根据需求按有时出现「我就知道你有病」，现在显示了，完美。
                
                // 再加一点小特效：按钮快乐震动
                btnYes.style.transform = 'scale(1.1)';
                setTimeout(() => { btnYes.style.transform = ''; }, 200);
                
                // 可以再补一句
                // 但为了防止多次点击“有”反复重置，状态已经为true，再次点击依然显示同样的话。
                // 但我们可以允许重复点击，仍然显示同样的话，并且“没有”按钮不再回归绝对定位(已经被复位)
                // 不过我们再次resetNoButton确保它在原位
                resetNoButton();
            }

            // ----- 强制让“没有”按钮一开始处于正常流，仅当需要逃跑时变为absolute -----
            // 初始化：确保按钮不是绝对定位，避免初始化就跑飞
            function initialize() {
                hasConfirmedSick = false;
                resetNoButton();
                messageBox.innerHTML = '🤔 请选择...';
                
                // 设置容器相对定位，为逃跑做准备但不强制
                container.style.position = 'relative';
                
                // 绑定事件 —— 使用addEventListener防止覆盖
                // 先移除可能绑定的监听，避免重复绑定（但该脚本只运行一次，安全）
            }

            // ----- 监听器挂载 -----
            btnYes.addEventListener('click', onYesClick);
            
            // 没有按钮：点击时疯狂逃跑
            btnNo.addEventListener('click', onNoClick);
            
            // 额外整蛊：鼠标悬停在“没有”按钮附近也会触发逃跑？为了更贱一点，但可能会引起性能或误判
            // 为了更符合“跑来跑去点不到”，增加mouseenter和hover轻微移动也不错，但过于敏感也许会惹恼。
            // 我们加一个轻微效果：当鼠标移入“没有”按钮立即逃跑，根本不给点击机会（但手机触摸仍靠click）
            // 同时增加移动端touch事件预防
            function enhancedEscape(e) {
                // 阻止默认防止意外
                e.preventDefault();
                if (!hasConfirmedSick) {
                    escapeNoButton();
                } else {
                    // 确诊后还是可以跑，但无所谓，顺便跑
                    escapeNoButton();
                }
            }

            // 鼠标移入时逃跑 —— PC端非常烦人，点击更难
            btnNo.addEventListener('mouseenter', function(e) {
                // 但不完全阻止click，只是让按钮瞬间移开，大概率点不中
                if (!hasConfirmedSick) {
                    escapeNoButton();
                } else {
                    // 确诊后依然可以调皮，但也可逃跑，随你
                    escapeNoButton();
                }
            });

            // 针对触摸设备，添加 touchstart 提前逃跑
            btnNo.addEventListener('touchstart', function(e) {
                e.preventDefault();  // 阻止默认滚动或长按菜单
                if (!hasConfirmedSick) {
                    escapeNoButton();
                } else {
                    escapeNoButton();
                }
            }, { passive: false });

            // 为了防止触摸时依然有可能触发click，我们让touchstart时也逃跑，从而click位置改变
            // 注意：如果按钮在触摸瞬间移走，则click不会被触发（因为手指下方元素变了），达到效果。

            // 同样，也给“没有”按钮加一个touchend逃跑？确保万劫不复
            btnNo.addEventListener('touchend', function(e) {
                e.preventDefault();
                // 快速再次逃跑，保证失败
                escapeNoButton();
            });

            // 但是为了不让“没有”按钮初始就在奇怪位置，执行初始化
            initialize();

            // 额外：当窗口大小改变，如果按钮是绝对定位，可能会飞出边界，重新调整？
            window.addEventListener('resize', function() {
                // 如果按钮当前为绝对定位(有left或top)，则重新计算位置防止出界
                if (btnNo.style.position === 'absolute' && btnNo.style.left) {
                    escapeNoButton(); // 重设随机位置，并限制在容器内
                }
            });

            // 最后，如果用户非常机智，在“没有”按钮跑动时狂点，我们用更多事件骚扰他
            // 点击container也可能触发？不管，就这样。

            // 还要注意：重置“有”按钮后，若点击“有”，我们将按钮复位，并把“没有”放回原位。
            // 但已经确诊后，用户如果再次点“有”，依然显示“我就知道你有病”，没问题。
            // 再次点“有”时，同时恢复原位。
            // 增加一点点趣味：当点击有时，把“没有”样式复位，并且消息固定。

            // 一切就绪！
        })();
    </script>

    <!-- 
        设计思路完全符合要求：
        - 初始显示“你有病吗？”
        - 两个按钮：没有 & 有
        - 按“没有”按钮：跑来跑去点不到（借助绝对定位+随机left/top，鼠标移入/触摸都会触发逃跑）
        - 按“有”按钮：出现“我就知道你有病”
        - 并且一旦点过“有”，再点“没有”虽然会跑，但也会显示嘲讽话语，主消息依然保留“我就知道你有病”？ 
          按照要求「按有时，出现我就知道你有病」已完美实现，并且没有覆盖掉。
    -->
</body>
</html>
