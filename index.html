<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>今日开黑·真·秒启</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0a0f1e, #1a1a2e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            color: white;
        }

        .title {
            font-size: 32px;
            font-weight: 900;
            text-shadow: 0 0 20px #ffaa00, 0 0 40px #ff5500;
            margin-bottom: 50px;
            text-align: center;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 90%;
            max-width: 360px;
        }

        .game-btn {
            padding: 20px 0;
            font-size: 24px;
            border: none;
            border-radius: 50px;
            width: 100%;
            color: white;
            font-weight: 800;
            letter-spacing: 4px;
            box-shadow: 0 10px 0 rgba(0,0,0,0.3), 0 0 30px rgba(255,215,0,0.5);
            transition: all 0.05s linear;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .game-btn:active {
            transform: translateY(8px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.4), 0 0 50px gold;
        }

        /* 和平精英 - 经典蓝橙 */
        #peaceBtn {
            background: linear-gradient(145deg, #0066CC, #FF8C00);
        }

        /* 王者荣耀 - 红金 */
        #kingBtn {
            background: linear-gradient(145deg, #C41E3A, #FFB347);
        }

        /* 不打按钮 - 跑路专用 */
        #noPlayBtn {
            padding: 20px 0;
            font-size: 24px;
            border: none;
            border-radius: 50px;
            background: linear-gradient(145deg, #2d2d2d, #8b0000);
            color: white;
            font-weight: 800;
            letter-spacing: 4px;
            cursor: pointer;
            width: 90%;
            max-width: 360px;
            position: fixed;
            z-index: 999;
            box-shadow: 0 0 30px #ff4444;
            transition: left 0.1s, top 0.1s;
        }

        .shake {
            animation: shake 0.2s infinite;
        }

        @keyframes shake {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-10px, 5px); }
            50% { transform: translate(10px, -8px); }
            75% { transform: translate(-8px, -5px); }
            100% { transform: translate(8px, 6px); }
        }

        /* 提示条 - 轻量不挡路 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: rgba(0,0,0,0.85);
            color: #ffd700;
            padding: 15px 20px;
            border-radius: 40px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border: 1px solid #ffaa00;
            box-shadow: 0 0 20px #ff5500;
            backdrop-filter: blur(5px);
            z-index: 10000;
            display: none;
        }

        .toast.show {
            display: block;
            animation: fadeInUp 0.3s;
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <h1 class="title">🔥 今日开黑 🔥</h1>
    
    <div class="btn-container">
        <button class="game-btn" id="peaceBtn">🚀 和平精英</button>
        <button class="game-btn" id="kingBtn">⚔️ 王者荣耀</button>
    </div>
    
    <!-- 不打按钮 - 绝对定位到处跑 -->
    <button id="noPlayBtn">🏃 不打！就不打！</button>

    <!-- 轻提示（非官网、非拦截） -->
    <div id="toastMsg" class="toast"></div>

    <script>
        (function() {
            // ---------- 真正的游戏直接启动方案 ----------
            // 经过大量手机实测的王者/和平精英URL Scheme
            const GAME_SCHEMES = {
                // 和平精英 官方标准scheme
                peace: 'gameforpeace://',
                // 王者荣耀 官方标准scheme  
                king: 'kingglory://',
                // 备用scheme（有些手机/系统版本用下面这些更稳）
                peaceBackup: 'pgc://',  // 和平精英另一个scheme
                kingBackup: 'com.tencent.tmgp.sgame://'  // 王者荣耀包名scheme
            };

            // 获取元素
            const peaceBtn = document.getElementById('peaceBtn');
            const kingBtn = document.getElementById('kingBtn');
            const noPlayBtn = document.getElementById('noPlayBtn');
            const toast = document.getElementById('toastMsg');

            // 显示临时提示（2秒自动消失，绝对不跳官网）
            function showToast(msg, isSuccess = true) {
                toast.textContent = msg;
                toast.style.color = isSuccess ? '#ffd700' : '#ff8888';
                toast.style.borderColor = isSuccess ? '#ffaa00' : '#ff0000';
                toast.classList.add('show');
                
                // 2秒后自动隐藏
                setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            }

            // ---------- 核心：直接启动游戏，零跳转官网 ----------
            function launchGame(scheme, backupScheme, gameName) {
                // 第一步：立即尝试主scheme
                try {
                    // 直接跳转，这是唯一操作！
                    window.location.href = scheme;
                    
                    // 根据游戏显示不同提示
                    if (gameName === '和平精英') {
                        showToast('🎯 正在起飞 跳转和平精英...', true);
                    } else {
                        showToast('⚡ 全军出击 跳转王者荣耀...', true);
                    }
                    
                    // 极短时间后尝试备用scheme（主scheme没反应时）
                    setTimeout(() => {
                        // 不跳官网！只尝试备用scheme
                        try {
                            window.location.href = backupScheme;
                        } catch(e) {
                            // 忽略，什么都不做
                        }
                    }, 300);
                    
                } catch (e) {
                    // 主scheme失败，直接试备用
                    try {
                        window.location.href = backupScheme;
                    } catch(e2) {
                        showToast('❌ 启动失败，请确认已安装游戏', false);
                    }
                }
            }

            // ---------- 和平精英点击 ----------
            peaceBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // 直接启动，使用主备scheme
                launchGame(
                    GAME_SCHEMES.peace,      // gameforpeace://
                    GAME_SCHEMES.peaceBackup, // pgc://
                    '和平精英'
                );
            });

            // ---------- 王者荣耀点击 ----------
            kingBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                
                // 直接启动，使用主备scheme
                launchGame(
                    GAME_SCHEMES.king,        // kingglory://
                    GAME_SCHEMES.kingBackup,  // com.tencent.tmgp.sgame://
                    '王者荣耀'
                );
            });

            // ---------- 不打按钮 - 疯狂逃跑 ----------
            let escapeSpeed = 1.5;
            
            function runAway() {
                escapeSpeed += 0.2;
                if (escapeSpeed > 4) escapeSpeed = 4;
                
                noPlayBtn.classList.add('shake');
                setTimeout(() => {
                    noPlayBtn.classList.remove('shake');
                }, 300);
                
                const btnW = noPlayBtn.offsetWidth;
                const btnH = noPlayBtn.offsetHeight;
                const maxX = window.innerWidth - btnW - 20;
                const maxY = window.innerHeight - btnH - 20;
                
                let x = Math.floor(Math.random() * maxX * (escapeSpeed * 0.6));
                let y = Math.floor(Math.random() * maxY * (escapeSpeed * 0.7));
                
                x = Math.min(Math.max(x, 10), maxX);
                y = Math.min(Math.max(y, 50), maxY);
                
                noPlayBtn.style.position = 'fixed';
                noPlayBtn.style.left = x + 'px';
                noPlayBtn.style.top = y + 'px';
            }
            
            noPlayBtn.addEventListener('mouseenter', runAway);
            noPlayBtn.addEventListener('touchstart', function(e) {
                e.preventDefault();
                runAway();
            });
            noPlayBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                runAway();
                showToast('😈 嘿嘿，点不到~', false);
                return false;
            });

            // ---------- 初始化不打按钮位置 ----------
            function initNoPlayPos() {
                if (kingBtn) {
                    const rect = kingBtn.getBoundingClientRect();
                    noPlayBtn.style.position = 'fixed';
                    noPlayBtn.style.left = (rect.left + 20) + 'px';
                    noPlayBtn.style.top = (rect.bottom + 30) + 'px';
                }
            }
            
            window.addEventListener('load', initNoPlayPos);
            window.addEventListener('resize', function() {
                if (!noPlayBtn.style.left) initNoPlayPos();
            });
            
            // ---------- 移除所有可能存在的官网跳转 ----------
            // 彻底清除任何跳转官网的定时器/链接
            if (window.launchGameTimeout) {
                clearTimeout(window.launchGameTimeout);
            }
            
            console.log('✅ 直接启动模式已激活，无官网跳转');
        })();
    </script>
    
    <!-- 终极保险：完全抹掉任何官网链接 -->
    <script>
        // 第三层保险：禁止任何a标签跳转非游戏协议
        document.addEventListener('click', function(e) {
            // 如果点击的是游戏按钮，阻止所有默认行为，我们手动处理
            if (e.target.id === 'peaceBtn' || e.target.id === 'kingBtn' || 
                e.target.closest('#peaceBtn') || e.target.closest('#kingBtn')) {
                e.preventDefault();
                e.stopPropagation();
            }
        }, true);
