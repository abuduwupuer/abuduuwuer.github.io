<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>今日按打啥游戏</title>
    <style>
        body {
            font-family: "微软雅黑", Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-color: #f0f8ff;
            box-sizing: border-box;
        }

        h1 {
            color: #333;
            margin-bottom: 40px;
            font-size: 24px;
            text-align: center;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%;
            max-width: 300px;
        }

        .btn {
            padding: 18px 0;
            font-size: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
            color: white;
        }

        #peaceBtn {
            background-color: #2196F3;
        }
        #peaceBtn:hover {
            background-color: #1976D2;
            transform: scale(1.03);
        }

        #kingBtn {
            background-color: #4CAF50;
        }
        #kingBtn:hover {
            background-color: #45a049;
            transform: scale(1.03);
        }

        #noPlayBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
            z-index: 999;
            width: 80%;
            max-width: 300px;
            padding: 18px 0;
            font-size: 18px;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <h1>今日按打啥游戏</h1>
    <div class="btn-container">
        <button class="btn" id="peaceBtn">打和平精英</button>
        <button class="btn" id="kingBtn">打王者荣耀</button>
        <button class="btn" id="noPlayBtn">不打</button>
    </div>

    <script>
        // 获取按钮元素
        const peaceBtn = document.getElementById('peaceBtn');
        const kingBtn = document.getElementById('kingBtn');
        const noPlayBtn = document.getElementById('noPlayBtn');

        // 检测设备类型（iOS/安卓）
        function getDeviceType() {
            const ua = navigator.userAgent.toLowerCase();
            if (ua.includes('iphone') || ua.includes('ipad') || ua.includes('ipod')) {
                return 'ios';
            } else if (ua.includes('android')) {
                return 'android';
            }
            return 'other';
        }

        // 通用唤起游戏函数
        function launchGame(scheme, backupUrl, gameName) {
            const deviceType = getDeviceType();
            
            // 根据设备类型给出提示
            if (deviceType === 'ios') {
                alert(`📱 iOS用户提示：
微信里无法直接启动${gameName}，请点击右上角「···」→「在浏览器中打开」，再点击按钮即可启动游戏！`);
            } else if (deviceType === 'android') {
                alert(`🎮 正在启动${gameName}...
如果未启动，请检查是否安装游戏，或更新微信后重试！`);
            }

            try {
                // 尝试唤起游戏APP
                window.location.href = scheme;
                
                // 延时检测，唤起失败则跳转官网并提示
                setTimeout(() => {
                    alert(`😥 ${gameName}唤起失败！
已为你跳转到${gameName}官网，可下载/打开游戏~`);
                    window.location.href = backupUrl;
                }, 1500);
            } catch (e) {
                alert(`❌ 唤起失败！已为你跳转到${gameName}官网`);
                window.location.href = backupUrl;
            }
        }

        // 打和平精英按钮事件
        peaceBtn.addEventListener('click', () => {
            launchGame('gameforpeace://', 'https://gp.qq.com/', '和平精英');
        });

        // 打王者荣耀按钮事件
        kingBtn.addEventListener('click', () => {
            launchGame('kingglory://', 'https://pvp.qq.com/', '王者荣耀');
        });

        // 不打按钮随机跑动
        noPlayBtn.addEventListener('touchstart', moveNoPlayBtn);
        noPlayBtn.addEventListener('mouseenter', moveNoPlayBtn);

        function moveNoPlayBtn() {
            const windowWidth = window.innerWidth - noPlayBtn.offsetWidth;
            const windowHeight = window.innerHeight - noPlayBtn.offsetHeight;
            const randomX = Math.floor(Math.random() * windowWidth);
            const randomY = Math.floor(Math.random() * windowHeight);
            noPlayBtn.style.left = `${randomX}px`;
            noPlayBtn.style.top = `${randomY}px`;
        }

        // 初始化按钮位置
        window.addEventListener('load', () => {
            const kingBtnRect = kingBtn.getBoundingClientRect();
            noPlayBtn.style.left = `${kingBtnRect.left}px`;
            noPlayBtn.style.top = `${kingBtnRect.bottom + 20}px`;
        });
    </script>
</body>
</html>
